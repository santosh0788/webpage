<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyLine Airlines Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.75)
    ),
    url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* LOGIN CARD */

.login-box{
    width:420px;
    padding:40px;
    border-radius:25px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 8px 32px rgba(0,0,0,0.4);

    text-align:center;
}

/* ICON */

.icon{
    font-size:50px;
    margin-bottom:10px;
}

/* BRAND */

.brand{
    font-size:32px;
    font-weight:700;
    color:white;
}

.subtitle{
    color:#d1d5db;
    margin-top:5px;
    margin-bottom:25px;
    font-size:14px;
}

/* TITLE */

h2{
    color:white;
    margin-bottom:20px;
}

/* INPUTS */

input{
    width:100%;
    padding:14px;
    margin:10px 0;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,0.12);

    color:white;
    font-size:15px;
}

input::placeholder{
    color:#d1d5db;
}

/* BUTTON */

button{
    width:100%;
    padding:14px;
    margin-top:15px;

    border:none;
    border-radius:12px;

    background:linear-gradient(
        135deg,
        #ff7b00,
        #ff5500
    );

    color:white;
    font-size:16px;
    font-weight:600;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        135deg,
        #ff9500,
        #ff6600
    );
}

/* FOOTER */

.footer{
    margin-top:18px;
    color:#d1d5db;
    font-size:13px;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="icon">✈️</div>

    <div class="brand">
        SkyLine Airlines
    </div>

    <div class="subtitle">
        Fly Beyond Expectations
    </div>

    <h2>Login</h2>

    <input
        id="user"
        type="text"
        placeholder="Username">

    <input
        id="pass"
        type="password"
        placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <div class="footer">
        Premium Airline Reservation System
    </div>

</div>

<script>

function login(){

    const u =
        document.getElementById("user").value;

    const p =
        document.getElementById("pass").value;

    if(u && p){

        localStorage.setItem("user",u);

        alert(
            "Welcome " +
            u +
            " ✈️"
        );

        window.location.href =
            "index.html";

    }

    else{

        alert(
            "Please enter Username and Password"
        );

    }

}

</script>

</body>
</html>
