<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Membership Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.payment-box{
  width:520px;
  background:white;
  padding:40px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.title{
  text-align:center;
  font-size:34px;
  font-weight:600;
  margin-bottom:25px;
}

.plan{
  text-align:center;
  font-size:24px;
  font-weight:600;
}

.price{
  text-align:center;
  font-size:50px;
  color:#16a34a;
  font-weight:700;
  margin:15px 0 30px;
}

/* PAYMENT METHODS */

.methods{
  display:flex;
  gap:15px;
  margin-bottom:30px;
}

.method{
  flex:1;
  padding:15px;
  border:2px solid #ddd;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.method.active{
  border-color:#2563eb;
  background:#eff6ff;
  color:#2563eb;
}

.payment-section{
  display:none;
}

.payment-section.active{
  display:block;
}

/* INPUTS */

.input-box{
  margin-bottom:20px;
}

.input-box label{
  display:block;
  margin-bottom:8px;
  font-weight:500;
}

.input-box input,
.input-box select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

/* BUTTON */

.pay-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#16a34a;
  color:white;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  margin-top:20px;
}

.pay-btn:hover{
  background:#15803d;
}

.secure{
  text-align:center;
  margin-top:15px;
  color:gray;
  font-size:14px;
}

</style>
</head>

<body>

<div class="payment-box">

  <div class="title">
    Membership Payment
  </div>

  <div class="plan" id="plan"></div>

  <div class="price" id="price"></div>

  <!-- PAYMENT METHODS -->

  <div class="methods">

    <div class="method active"
      onclick="showMethod('card',this)">
      💳 Card
    </div>

    <div class="method"
      onclick="showMethod('upi',this)">
      📱 UPI
    </div>

    <div class="method"
      onclick="showMethod('bank',this)">
      🏦 Banking
    </div>

  </div>

  <!-- CARD PAYMENT -->

  <div id="card" class="payment-section active">

    <div class="input-box">
      <label>Card Holder Name</label>
      <input type="text" placeholder="Enter Name">
    </div>

    <div class="input-box">
      <label>Card Number</label>
      <input type="text" placeholder="1234 5678 9012 3456">
    </div>

    <div class="input-box">
      <label>Expiry Date</label>
      <input type="text" placeholder="MM/YY">
    </div>

    <div class="input-box">
      <label>CVV</label>
      <input type="password" placeholder="123">
    </div>

  </div>

  <!-- UPI PAYMENT -->

  <div id="upi" class="payment-section">

    <div class="input-box">
      <label>UPI ID</label>
      <input type="text"
        placeholder="example@paytm">
    </div>

    <div class="input-box">
      <label>Mobile Number</label>
      <input type="text"
        placeholder="Enter Mobile Number">
    </div>

  </div>

  <!-- NET BANKING -->

  <div id="bank" class="payment-section">

    <div class="input-box">
      <label>Select Bank</label>

      <select>

        <option>SBI Bank</option>
        <option>HDFC Bank</option>
        <option>ICICI Bank</option>
        <option>Axis Bank</option>
        <option>Kotak Bank</option>

      </select>

    </div>

    <div class="input-box">
      <label>Account Holder Name</label>
      <input type="text"
        placeholder="Enter Name">
    </div>

  </div>

  <!-- PAY -->

  <button class="pay-btn" onclick="payNow()">
    Pay Now
  </button>

  <div class="secure">
    🔒 100% Secure Payment Gateway
  </div>

</div>

<script>

/* URL VALUES */

const params =
  new URLSearchParams(window.location.search);

const type =
  params.get("type");

const price =
  params.get("price");

/* SHOW PLAN */

document.getElementById("plan").innerText =
  type + " Membership";

document.getElementById("price").innerText =
  "$" + price;

/* PAYMENT METHOD SWITCH */

function showMethod(id, element){

  document
    .querySelectorAll(".payment-section")
    .forEach(section=>{

      section.classList.remove("active");

    });

  document
    .querySelectorAll(".method")
    .forEach(btn=>{

      btn.classList.remove("active");

    });

  document
    .getElementById(id)
    .classList.add("active");

  element.classList.add("active");

}

/* PAYMENT */

function payNow(){

  alert(
    "Payment Successful for " +
    type +
    " Membership 🎉"
  );

window.location.href = "membership-dashboard.html";

}

</script>

</body>
</html>
