<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:500px;
  background:white;
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.plan{
  font-size:40px;
  font-weight:700;
}

.price{
  font-size:50px;
  color:#16a34a;
  margin:20px 0;
}

.features{
  text-align:left;
  margin-top:25px;
}

.features p{
  margin:15px 0;
}

.btn{
  width:100%;
  padding:16px;
  margin-top:30px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:18px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

  <div class="plan" id="plan"></div>

  <div class="price" id="price"></div>

  <div class="features">

    <p>✅ Priority Flight Booking</p>
    <p>✅ Discount on Tickets</p>
    <p>✅ Premium Customer Support</p>
    <p>✅ Special Travel Offers</p>

  </div>

  <button class="btn" onclick="goPayment()">
    Continue Payment
  </button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const type = params.get("type");
const price = params.get("price");

document.getElementById("plan").innerText =
  type + " Membership";

document.getElementById("price").innerText =
  "$" + price;

function goPayment(){

  window.location.href =
    `membership-payment.html?type=${type}&price=${price}`;

}

</script>

</body>
</html>
