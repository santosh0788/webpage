<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Ticket</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* MAIN TICKET */

.ticket{
  display:flex;
  width:1000px;
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* LEFT SIDE */

.ticket-left{
  flex:3;
  padding:35px;
}

.logo{
  font-size:34px;
  font-weight:700;
  margin-bottom:20px;
}

.title{
  text-align:center;
  font-size:32px;
  font-weight:600;
  margin-bottom:35px;
}

/* INFO GRID */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  margin-bottom:35px;
}

.label{
  color:gray;
  font-size:14px;
  margin-bottom:5px;
}

.value{
  font-size:20px;
  font-weight:600;
  word-break:break-word;
}

/* BOTTOM */

.bottom{
  display:flex;
  justify-content:space-between;
  background:#f1f5f9;
  padding:22px;
  border-radius:18px;
}

.box{
  text-align:center;
}

.box span{
  color:gray;
  font-size:14px;
}

.box strong{
  display:block;
  margin-top:8px;
  font-size:20px;
}

/* RIGHT SIDE */

.ticket-right{
  flex:1.4;
  border-left:2px dashed #cbd5e1;
  padding:35px;
  text-align:center;
}

.pnr{
  font-size:32px;
  font-weight:700;
  margin-bottom:20px;
}

/* QR CODE */

.qr{
  width:180px;
  height:180px;
  margin:25px auto;
  padding:10px;
  background:white;
  border-radius:14px;
  border:4px solid #111827;
  display:flex;
  justify-content:center;
  align-items:center;
}

.qr img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTTON */

.download{
  margin-top:20px;
  background:#16a34a;
  color:white;
  padding:15px;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

.download:hover{
  background:#15803d;
}

/* PRINT */

@media print{

  body{
    background:white;
  }

  .download{
    display:none;
  }

}

</style>
</head>

<body>

<div class="ticket">

  <!-- LEFT -->

  <div class="ticket-left">

    <div class="logo">✈ SkyLine Airlines</div>

    <div class="title">Boarding Pass</div>

    <div class="info">

      <div>
        <div class="label">Passengers</div>
        <div class="value" id="passenger"></div>
      </div>

      <div>
        <div class="label">Flight</div>
        <div class="value" id="flight"></div>
      </div>

      <div>
        <div class="label">Route</div>
        <div class="value" id="route"></div>
      </div>

      <div>
        <div class="label">Time</div>
        <div class="value" id="time"></div>
      </div>

    </div>

    <!-- BOTTOM -->

    <div class="bottom">

      <div class="box">
        <span>Gate</span>
        <strong>12</strong>
      </div>

      <div class="box">
        <span>Seats</span>
        <strong id="seat"></strong>
      </div>

      <div class="box">
        <span>Passengers</span>
        <strong id="passengers"></strong>
      </div>

      <div class="box">
        <span>PNR</span>
        <strong id="pnr"></strong>
      </div>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="ticket-right">

    <div class="pnr" id="pnr2"></div>

    <!-- QR -->

    <div class="qr">
      <img id="qrImage" src="">
    </div>

    <!-- DOWNLOAD -->

    <div class="download" onclick="downloadTicket()">
      Download Ticket
    </div>

  </div>

</div>

<script>

/* URL PARAMETERS */

const params = new URLSearchParams(window.location.search);

/* GET VALUES */

const names =
  params.get("names") || "N/A";

const flight =
  params.get("flight") || "N/A";

const from =
  params.get("from") || "N/A";

const to =
  params.get("to") || "N/A";

const time =
  params.get("time") || "N/A";

const seats =
  params.get("seat") || "N/A";

const passengers =
  params.get("passengers") || "1";

/* DISPLAY VALUES */

document.getElementById("passenger").innerText =
  names.replaceAll("|", ", ");

document.getElementById("flight").innerText =
  flight;

document.getElementById("route").innerText =
  from + " → " + to;

document.getElementById("time").innerText =
  time;

document.getElementById("seat").innerText =
  seats;

document.getElementById("passengers").innerText =
  passengers;

/* RANDOM PNR */

const pnr =
  "PNR" + Math.floor(Math.random() * 100000);

document.getElementById("pnr").innerText =
  pnr;

document.getElementById("pnr2").innerText =
  pnr;

/* QR CODE DATA */

const qrData =
`Passengers: ${names}
Flight: ${flight}
Route: ${from} → ${to}
Seats: ${seats}
Passengers Count: ${passengers}
PNR: ${pnr}`;

/* GENERATE REAL QR */

document.getElementById("qrImage").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="
  + encodeURIComponent(qrData);

/* DOWNLOAD */

function downloadTicket(){

  window.print();

}

</script>

</body>
</html>
